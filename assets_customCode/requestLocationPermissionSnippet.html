<style>
  #manualLocationPermissionRequest {
    display: none;
  }
</style>

<script>
  document.addEventListener('DOMContentLoaded', async () => {
    const permissionButton = document.getElementById(
      'manualLocationPermissionRequest',
    );

    /**
     * Standardized UI update based on permission state
     */
    const updateUI = (result) => {
      // Handle fallback strings from catch blocks (e.g., 'prompt' or 'denied')
      const locationStatus = typeof result === 'string' ? result : result.location;
      const coarseStatus = typeof result === 'string' ? result : result.coarseLocation;

      if (locationStatus === 'granted' && coarseStatus === 'denied') {
        permissionButton.style.display = 'inline-block';
        permissionButton.style.opacity = '0.5';
        permissionButton.style.pointerEvents = 'none';
        permissionButton.innerHTML =
          "Please enter your phone settings and enable precise location access";
      } else if (locationStatus === 'granted') {
        permissionButton.style.display = 'none';
      } else if (locationStatus === 'denied') {
        permissionButton.style.display = 'inline-block';
        permissionButton.style.opacity = '0.5';
        permissionButton.style.pointerEvents = 'none';
        permissionButton.innerHTML =
          "Please enter your phone's settings to enable location access";
      } else {
        permissionButton.style.display = 'inline-block';
        permissionButton.style.opacity = '1';
        permissionButton.style.pointerEvents = 'auto';
        
        // Clear any previous listener instance before adding the new one
        permissionButton.removeEventListener('click', handleRequestPermission);
        permissionButton.addEventListener('click', handleRequestPermission, {
          once: true,
        });
      }
    };

    /**
     * Checks state, updates UI, and returns status
     */
    const syncPermissions = async () => {
      try {
        const result = await Geolocate.checkPermissions();
        updateUI(result);
        return result;
      } catch (error) {
        console.error('Error checking permissions:', error);
        // Fallback to prompting UI if the check fails
        updateUI('prompt');
        return 'prompt';
      }
    };

    /**
     * Triggered solely on user button click
     */
    const handleRequestPermission = async () => {
      try {
        const result = await Geolocate.requestPermissions();

        updateUI(result);
      } catch (error) {
        console.error('Error requesting permissions:', error);
        updateUI('denied');
      }
    };

    // Initialize state check on page load. 
    await syncPermissions();

    // Listen for the app returning from background
    App.addListener('appStateChange', async ({ isActive }) => {
      if (isActive) {
        await syncPermissions();
      }
    });
  });
</script>
