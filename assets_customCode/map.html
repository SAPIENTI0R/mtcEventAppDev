<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet Fullscreen CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet.fullscreen/dist/Control.FullScreen.css" />
<script src="https://unpkg.com/leaflet.fullscreen/dist/Control.FullScreen.umd.js"></script>

<!-- CSS Styles-->
<style>
  .bsr-map-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    margin-bottom: 30px;
    font-family: inherit;
  }

  .bsr-controls {
    background: #f7f7f7;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
  }

  .bsr-controls label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
  }

  .bsr-search-wrapper {
    display: flex;
    gap: 10px;
  }

  .bsr-search-container {
    position: relative;
    flex-grow: 1;
  }

  .bsr-search-wrapper input {
    width: 100%;
    box-sizing: border-box;
    padding: 10px 35px 10px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
  }

  .bsr-clear-search {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #888;
    display: none;
    z-index: 10;
  }

  .bsr-dropdown {
    display: none;
    position: absolute;
    top: 100%;
    left: 0;
    width: 100%;
    background: white;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    z-index: 1000;
    max-height: 250px;
    overflow-y: auto;
    flex-direction: column;
    gap: 5px;
    padding: 5px;
    margin-top: 2px;
    box-sizing: border-box;
  }

  .bsr-dropdown.show {
    display: flex;
  }

  .bsr-dropdown-item {
    padding: 10px;
    background: #f7f7f7;
    border: 1px solid #eee;
    border-radius: 4px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex-shrink: 0;
  }

  .bsr-dropdown-item:hover, .bsr-dropdown-item:active {
    background: #e0e0e0;
  }

  #bsr-status-message {
    margin-top: 10px;
    font-size: 14px;
    color: var(--Scouting_Red);
  }

  #bsr-status-message:empty {
    display: none;
  }

  #bsr-map {
    height: 600px;
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ddd;
    z-index: 1;
  }

  .custom-color-marker {
    background: transparent;
    border: none;
  }

  #bsr-directions {
    background: #f7f7f7;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-top: -15px;
  }

  #bsr-directions h3 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 18px;
  }

  #bsr-directions-list {
    margin: 0;
    padding-left: 20px;
    font-size: 15px;
    line-height: 1.4;
  }

  #bsr-directions-list li {
    margin-bottom: 8px;
  }

  .bsr-fallback-note {
    color: #666;
    font-size: 13px;
    display: block;
    margin-top: 4px;
  }

  .bsr-refresh-icon {
    cursor: pointer;
    margin-left: 5px;
    -webkit-tap-highlight-color: transparent;
  }
</style>

<!-- JavaScript-->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // 1. Configuration & Setup
    const isApp = !!window.Capacitor;
    const orsApiKey =
      'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjZjYzY1NjNkZmEwMzQ5MDZhOTUyMjcyZjc5ZDRiOWIwIiwiaCI6Im11cm11cjY0In0=';

    // Bounding box for Boxwell Scout Reservation
    const bounds = [
      [36.30686681473789, -86.47847920773354], // South-West
      [36.32877841275319, -86.44562826095796], // North-East
    ];
    const overpassBounds = `${bounds[0][0]},${bounds[0][1]},${bounds[1][0]},${bounds[1][1]}`;

    // Wider bounding box to prevent panning to other cities (roughly 5 miles wider)
    const maxMapBounds = [
      [36.28747344347164, -86.49375812339811], // South-West
      [36.33594716392268, -86.43211316095773], // North-East
    ];

    let locationsMap = {};
    let currentRouteLayer = null;
    let destinationMarker = null;
    let userMarker = null;

    // Helper function to create custom colored SVG markers
    function createColorMarker(colorStr) {
      const svg = `<svg viewBox="0 0 24 24" width="30" height="42" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" style="fill: ${colorStr}; stroke: #ffffff; stroke-width: 1px;"/>
    </svg>`;

      return L.divIcon({
        className: 'custom-color-marker',
        html: svg,
        iconSize: [30, 42],
        iconAnchor: [15, 42],
        popupAnchor: [0, -35],
      });
    }

    // Helper function to format distance (meters -> ft/miles)
    function formatDistance(distanceInMeters) {
      const distanceInFeet = distanceInMeters * 3.28084;
      if (distanceInFeet >= 5280) {
        // Convert to miles and round to 1 decimal place
        const distanceInMiles = (distanceInFeet / 5280).toFixed(1);
        return `${distanceInMiles} mi`;
      } else {
        // Return whole feet with commas
        return `${Math.round(distanceInFeet).toLocaleString('en-US')} ft`;
      }
    }

    // 2. Initialize Map
    const map = L.map('bsr-map', {
      maxBounds: maxMapBounds,
      maxBoundsViscosity: 0.8,
      minZoom: 12
    }).fitBounds(bounds);

    // Custom Compass Control
    const CompassControl = L.Control.extend({
      options: { position: 'topright' },
      onAdd: function(map) {
        const div = L.DomUtil.create('div', 'leaflet-bar leaflet-control bsr-compass-control');
        div.innerHTML = `
          <div style="background: white; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 4px; cursor: pointer;" title="Compass">
            <svg id="compass-icon" viewBox="0 0 100 100" width="30" height="30" style="transition: transform 0.1s linear; transform: rotate(0deg); transform-origin: center center;">
              <circle cx="50" cy="50" r="45" fill="white" stroke="#ccc" stroke-width="2"/>
              <polygon points="50,10 65,50 50,50" fill="#ff4444" />
              <polygon points="50,10 35,50 50,50" fill="#cc0000" />
              <polygon points="50,90 65,50 50,50" fill="#cccccc" />
              <polygon points="50,90 35,50 50,50" fill="#999999" />
              <circle cx="50" cy="50" r="4" fill="#333" />
            </svg>
          </div>
        `;
        L.DomEvent.disableClickPropagation(div);
        
        div.addEventListener('click', async () => {
          // Request iOS 13+ device orientation permissions on click
          if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
              const permission = await DeviceOrientationEvent.requestPermission();
              if (permission !== 'granted') {
                console.warn('Compass permission not granted');
              }
            } catch (err) {
              console.error(err);
            }
          }
          // Also optionally re-center map on user when clicking compass
          if (userMarker) {
            map.flyTo(userMarker.getLatLng(), 16);
          }
        });
        
        return div;
      }
    });
    map.addControl(new CompassControl());

    // Setup Compass Listener
    let hasAbsolute = false;
    
    function handleOrientation(event) {
      const compass = document.getElementById('compass-icon');
      if (!compass) return;

      // Prefer absolute orientation if available
      if (event.type === 'deviceorientationabsolute' || event.absolute) {
        hasAbsolute = true;
      }
      
      // If we've seen absolute events, ignore relative ones to prevent jitter
      if (event.type === 'deviceorientation' && hasAbsolute && !event.absolute) {
        return;
      }

      if (event.webkitCompassHeading !== undefined && event.webkitCompassHeading !== null) {
        // iOS: webkitCompassHeading is clockwise (0=N, 90=E). Rotate needle CCW to stay pointing North.
        compass.style.transform = `rotate(${-event.webkitCompassHeading}deg)`;
      } else if (event.alpha !== null) {
        // W3C standard: alpha is counter-clockwise (0=N, 90=W). Rotate needle CW to stay pointing North.
        compass.style.transform = `rotate(${event.alpha}deg)`;
      }
    }

    // Modern Android browsers use deviceorientationabsolute for true compass heading
    if ('ondeviceorientationabsolute' in window) {
      window.addEventListener('deviceorientationabsolute', handleOrientation);
    }
    // Fallback standard deviceorientation (which is relative on Android, absolute on iOS)
    window.addEventListener('deviceorientation', handleOrientation);


    // Helper function for user location
    async function getUserCoords() {
      if (isApp && typeof Geolocate !== 'undefined') {
        const pos = await Geolocate.getCurrentPosition({ enableHighAccuracy: true });
        return { lat: pos.coords.latitude, lon: pos.coords.longitude };
      } else if (navigator.geolocation) {
        return new Promise((resolve, reject) => {
          navigator.geolocation.getCurrentPosition(
            (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude }),
            (err) => reject(err)
          );
        });
      }
      throw new Error('Geolocation not supported');
    }

    // Automatically plot user location if available
    async function plotUserLocation() {
      try {
        const coords = await getUserCoords();
        if (!userMarker) {
          userMarker = L.marker([coords.lat, coords.lon], {
            icon: createColorMarker('var(--Scouting_Light_Blue)'),
          })
            .addTo(map)
            .bindPopup('You are here');
        }
      } catch (err) {
        console.log('Could not get user location on map load:', err);
      }
    }
    plotUserLocation();

    // Explicitly add the fullscreen control
    if (L.Control.FullScreen) {
      map.addControl(
        new L.Control.FullScreen({
          position: 'topleft',
        }),
      );
    } else {
      console.error('The Fullscreen plugin failed to load.');
    }

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors',
    }).addTo(map);

    // 3. Fetch Locations from Overpass API
    async function fetchLocations() {
      const statusEl = document.getElementById('bsr-status-message');
      statusEl.innerText = 'Loading map data...';

      // Querying nodes and ways with names or alt_names inside the bounds
      const overpassQuery = `
      [out:json][timeout:25];
      (
        node["name"](${overpassBounds});
        way["name"](${overpassBounds});
        node["alt_name"](${overpassBounds});
        way["alt_name"](${overpassBounds});
      );
      out center;
    `;
      const overpassUrl = 'https://overpass-api.de/api/interpreter';

      try {
        const response = await fetch(overpassUrl, {
          method: 'POST',
          body: overpassQuery,
        });
        const data = await response.json();

        const dropdown = document.getElementById('bsr-custom-dropdown');
        const dropdownItemsData = [];

        data.elements.forEach((element) => {
          // Filter out roads and trails
          if (element.tags.highway) return;

          // Use name, or fallback to alt_name if name is missing
          const name = element.tags.name || element.tags.alt_name;
          const altName = element.tags.alt_name;
          
          if (!name) return;

          // Filter out any item containing "XC#"
          if (name.includes('XC#')) return;
          if (altName && altName.includes('XC#')) return;

          // ways have 'center' for coords, nodes have 'lat' and 'lon' directly
          const lat = element.lat || element.center.lat;
          const lon = element.lon || element.center.lon;

          // Prevent duplicates in dropdown
          if (!locationsMap[name]) {
            locationsMap[name] = { lat, lon };
            dropdownItemsData.push({
              value: name,
              displayText: name
            });
          }

          // Also add alt_name as a searchable option if it exists and differs from name
          if (altName && altName !== name && !locationsMap[altName]) {
            locationsMap[altName] = { lat, lon };
            dropdownItemsData.push({
              value: altName,
              displayText: altName
            });
          }
        });

        // Sort items alphabetically by display text
        dropdownItemsData.sort((a, b) => a.displayText.localeCompare(b.displayText));

        // Create and append DOM elements
        dropdownItemsData.forEach(itemData => {
          const item = document.createElement('div');
          item.className = 'bsr-dropdown-item';
          item.textContent = itemData.displayText;
          
          item.addEventListener('click', () => {
            document.getElementById('bsr-destination-input').value = itemData.value;
            dropdown.classList.remove('show');
            handleGoAction();
          });
          
          dropdown.appendChild(item);
        });
        statusEl.innerText = '';
        checkUrlParams();
      } catch (err) {
        console.error(err);
        statusEl.innerHTML = 'Failed to load locations. Please try refreshing. <i class="fas fa-sync bsr-refresh-icon" onclick="this.classList.add(\'fa-spin\'); location.reload();" title="Reload Page"></i>';
      }
    }

    // 4. Handle URL Params
    function checkUrlParams() {
      const params = new URLSearchParams(window.location.search);
      const destParam = params.get('destination');

      if (destParam) {
        if (locationsMap[destParam]) {
          document.getElementById('bsr-destination-input').value = destParam;
          handleGoAction();
        } else {
          console.warn(`Destination "${destParam}" not found in locations.`);
        }
      }
    }

    // 5. Handle Navigation / Mapping Logic
    async function handleGoAction() {
      const inputVal = document.getElementById('bsr-destination-input').value;
      const statusEl = document.getElementById('bsr-status-message');

      if (!inputVal || !locationsMap[inputVal]) {
        statusEl.innerText = 'Please select a valid location from the list.';
        return;
      }

      statusEl.innerText = '';
      const destCoords = locationsMap[inputVal];

      // Clear previous markers/routes
      if (destinationMarker) map.removeLayer(destinationMarker);
      if (currentRouteLayer) map.removeLayer(currentRouteLayer);
      if (userMarker) map.removeLayer(userMarker);
      document.getElementById('bsr-directions').style.display = 'none';

      // Place marker for destination
      destinationMarker = L.marker([destCoords.lat, destCoords.lon], {
        icon: createColorMarker('var(--Scouting_Red)'),
      })
        .addTo(map)
        .bindPopup(`<b>${inputVal}</b>`)
        .openPopup();

      if (!isApp) {
        // Web Failsafe: Just pan to the location
        map.flyTo([destCoords.lat, destCoords.lon], 16);
        return;
      }

      // App Navigation Logic (Capacitor)
      let userLat, userLon;

      // Stage 1: Get User Location
      try {
        statusEl.innerText = 'Finding your location...';
        const coords = await getUserCoords();
        userLat = coords.lat;
        userLon = coords.lon;

        // Draw the user marker immediately
        userMarker = L.marker([userLat, userLon], {
          icon: createColorMarker('var(--Scouting_Light_Blue)'),
        })
          .addTo(map)
          .bindPopup('You are here');

        // Adjust map to temporarily fit both markers while routing
        map.fitBounds(
          L.latLngBounds([userLat, userLon], [destCoords.lat, destCoords.lon]),
          { padding: [50, 50] },
        );
      } catch (error) {
        console.error('Location Error:', error);
        statusEl.innerText =
          'Cannot get location. Showing destination instead.';
        map.flyTo([destCoords.lat, destCoords.lon], 16);
        return;
      }

      // Stage 2: Calculate Route (with Fallback)
      try {
        statusEl.innerText = 'Calculating route...';
        await calculateRoute(userLat, userLon, destCoords.lat, destCoords.lon);
        statusEl.innerText = ''; // Clear status on success
      } catch (error) {
        console.warn('Routing Error, falling back to direct line:', error);
        statusEl.innerText = 'No pathway found. Showing direct line instead.';

        // --- FALLBACK LOGIC ---

        // 1. Draw straight dashed line to indicate an estimated, direct path
        currentRouteLayer = L.polyline(
          [
            [userLat, userLon],
            [destCoords.lat, destCoords.lon],
          ],
          { color: 'gray', weight: 4, dashArray: '10, 10' },
        ).addTo(map);

        // 2. Ensure map fits the new straight line
        map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });

        // 3. Calculate distance using Leaflet's built-in distance method (returns meters)
        const startLatLng = L.latLng(userLat, userLon);
        const endLatLng = L.latLng(destCoords.lat, destCoords.lon);
        const distanceMeters = startLatLng.distanceTo(endLatLng);

        // Format string (uses miles if > 5280 ft)
        const displayDistance = formatDistance(distanceMeters);
        
        // Format total distance in miles for the header
        const distanceMiles = (distanceMeters * 0.000621371).toFixed(1);
        document.getElementById('bsr-directions-title').innerText = `Directions (${distanceMiles} mi)`;

        // 4. Update Directions Panel with fallback instruction
        const directionsList = document.getElementById('bsr-directions-list');
        directionsList.innerHTML = `
          <li>
            <b>Straight-Line Distance:</b> ${displayDistance} <br>
            <span class="bsr-fallback-note">Note: A mapped pathway could not be found. Head generally towards the destination marker, but be aware of real-world obstacles and terrain.</span>
          </li>`;

        document.getElementById('bsr-directions').style.display = 'block';
      }
    }

    // 6. OpenRouteService Routing
    async function calculateRoute(startLat, startLon, endLat, endLon) {
      // ORS requires coordinates in longitude, latitude order
      const url = `https://api.heigit.org/openrouteservice/v2/directions/foot-walking?api_key=${orsApiKey}&start=${startLon},${startLat}&end=${endLon},${endLat}`;

      const response = await fetch(url);
      const data = await response.json();

      if (data.features && data.features.length > 0) {
        const feature = data.features[0];

        // 1. Draw the Polyline
        // ORS returns GeoJSON which is [lon, lat], Leaflet wants [lat, lon]
        const coords = feature.geometry.coordinates.map((c) => [c[1], c[0]]);
        currentRouteLayer = L.polyline(coords, {
          color: 'blue',
          weight: 5,
        }).addTo(map);

        // 2. Zoom map to fit the route
        map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });

        // 3. GENERATE DIRECTIONS
        const steps = feature.properties.segments[0].steps;
        const summary = feature.properties.summary;
        
        if (summary && summary.distance !== undefined) {
          const totalDistanceMiles = (summary.distance * 0.000621371).toFixed(1);
          document.getElementById('bsr-directions-title').innerText = `Directions (${totalDistanceMiles} mi)`;
        } else {
          document.getElementById('bsr-directions-title').innerText = 'Directions';
        }

        if (steps && steps.length > 0) {
          const directionsList = document.getElementById('bsr-directions-list');
          directionsList.innerHTML = ''; // Clear old instructions

          steps.forEach((step) => {
            const li = document.createElement('li');

            // Format distance string (uses miles if > 5280 ft)
            const distanceText =
              step.distance > 0 ? ` (${formatDistance(step.distance)})` : '';

            // Set the text (ORS uses 'instruction' instead of 'text')
            li.innerText = step.instruction + distanceText;
            directionsList.appendChild(li);
          });

          // Reveal the directions panel
          document.getElementById('bsr-directions').style.display = 'block';
        }
      } else if (data.error) {
        // This extracts the exact reason ORS rejected the request
        throw new Error(
          `ORS API: ${data.error.message || JSON.stringify(data.error)}`,
        );
      } else {
        throw new Error(`Unexpected Response: ${JSON.stringify(data)}`);
      }
    }

    // Event Listeners

    // Trigger on Enter key
    document
      .getElementById('bsr-destination-input')
      .addEventListener('keypress', function (e) {
        if (e.key === 'Enter') handleGoAction();
      });

    // Custom Dropdown Logic
    const searchInput = document.getElementById('bsr-destination-input');
    const customDropdown = document.getElementById('bsr-custom-dropdown');
    const clearBtnWrapper = document.getElementById('bsr-clear-search-wrapper');

    clearBtnWrapper.addEventListener('click', function() {
      searchInput.value = '';
      clearBtnWrapper.style.display = 'none';
      customDropdown.classList.remove('show');
      searchInput.focus();
    });

    searchInput.addEventListener('input', function() {
      clearBtnWrapper.style.display = this.value.length > 0 ? 'block' : 'none';
      const filter = this.value.toLowerCase();
      const items = customDropdown.getElementsByClassName('bsr-dropdown-item');
      let hasVisibleItems = false;
      
      for (let i = 0; i < items.length; i++) {
        const txtValue = items[i].textContent || items[i].innerText;
        if (txtValue.toLowerCase().indexOf(filter) > -1) {
          items[i].style.display = "";
          hasVisibleItems = true;
        } else {
          items[i].style.display = "none";
        }
      }
      
      if (hasVisibleItems) {
        customDropdown.classList.add('show');
      } else {
        customDropdown.classList.remove('show');
      }
    });

    ['focus', 'click'].forEach(evt => {
      searchInput.addEventListener(evt, function() {
        if (Object.keys(locationsMap).length > 0) {
          this.dispatchEvent(new Event('input'));
        }
      });
    });

    // Hide dropdown when clicking outside
    document.addEventListener('click', function(e) {
      if (e.target !== searchInput && !customDropdown.contains(e.target)) {
        customDropdown.classList.remove('show');
      }
    });

    // Initialize data fetch
    fetchLocations();
  });
</script>

<div class="bsr-map-container">
  <!-- Static Control Panel -->
  <div class="bsr-controls">
    <div class="bsr-search-wrapper">
      <div class="bsr-search-container">
        <input type="text" id="bsr-destination-input" placeholder="Search for a place..." autocomplete="off" />
        <span id="bsr-clear-search-wrapper" class="bsr-clear-search">
          <i class="fas fa-times"></i>
        </span>
        <div id="bsr-custom-dropdown" class="bsr-dropdown"></div>
      </div>
    </div>
    <div id="bsr-status-message"></div>
  </div>

  <!-- Map Display -->
  <div id="bsr-map"></div>

  <!-- Directions Panel (Hidden by default) -->
  <div id="bsr-directions" style="display: none">
    <h3 id="bsr-directions-title">Directions</h3>
    <ol id="bsr-directions-list"></ol>
  </div>
</div>
