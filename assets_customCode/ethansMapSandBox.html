<!-- Leaflet CSS & JS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet Fullscreen CSS & JS -->
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet.fullscreen@4.0.0/Control.FullScreen.css"
/>
<script src="https://unpkg.com/leaflet.fullscreen@4.0.0/Control.FullScreen.js"></script>

<!-- CSS Styles-->
<style>
  .bsr-map-container {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    margin-bottom: 30px;
    font-family: inherit;
  }

  .bsr-controls {
    background: #f7f7f7;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
  }

  .bsr-controls label {
    display: block;
    margin-bottom: 8px;
    font-weight: bold;
  }

  .bsr-search-wrapper {
    display: flex;
    gap: 10px;
  }

  .bsr-search-wrapper input {
    flex-grow: 1;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 16px;
  }

  .bsr-search-wrapper button {
    padding: 10px 20px;
    background: var(--Scouting_Red);
    color: var(--White);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    font-size: 16px;
  }

  .bsr-search-wrapper button:hover {
    filter: brightness(0.85);
  }

  #bsr-status-message {
    margin-top: 10px;
    font-size: 14px;
    color: var(--Scouting_Red);
  }

  #bsr-map {
    height: 600px;
    width: 100%;
    border-radius: 6px;
    border: 1px solid #ddd;
    z-index: 1;
  }

  .custom-color-marker {
    background: transparent;
    border: none;
  }

  #bsr-directions {
    background: #f7f7f7;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 6px;
    margin-top: -15px;
  }

  #bsr-directions h3 {
    margin-top: 0;
    margin-bottom: 10px;
    font-size: 18px;
  }

  #bsr-directions-list {
    margin: 0;
    padding-left: 20px;
    font-size: 15px;
    line-height: 1.4;
  }

  #bsr-directions-list li {
    margin-bottom: 8px;
  }
</style>

<!-- JavaScript-->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    // 1. Configuration & Setup
    const isApp = !!window.Capacitor;
    const orsApiKey =
      'eyJvcmciOiI1YjNjZTM1OTc4NTExMTAwMDFjZjYyNDgiLCJpZCI6IjZjYzY1NjNkZmEwMzQ5MDZhOTUyMjcyZjc5ZDRiOWIwIiwiaCI6Im11cm11cjY0In0=';

    // Bounding box for Boxwell Scout Reservation: SW to NE
    const bounds = [
      [36.30766, -86.47862], // South-West
      [36.32951, -86.44785], // North-East
    ];

    let locationsMap = {};
    let currentRouteLayer = null;
    let destinationMarker = null;
    let userMarker = null;

    // Helper function to create custom colored SVG markers
    function createColorMarker(colorStr) {
      const svg = `<svg viewBox="0 0 24 24" width="30" height="42" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" style="fill: ${colorStr}; stroke: #ffffff; stroke-width: 1px;"/>
    </svg>`;

      return L.divIcon({
        className: 'custom-color-marker',
        html: svg,
        iconSize: [30, 42],
        iconAnchor: [15, 42],
        popupAnchor: [0, -35],
      });
    }

    // Helper function to format distance (meters -> ft/miles)
    function formatDistance(distanceInMeters) {
      const distanceInFeet = distanceInMeters * 3.28084;
      if (distanceInFeet >= 5280) {
        // Convert to miles and round to 1 decimal place
        const distanceInMiles = (distanceInFeet / 5280).toFixed(1);
        return `${distanceInMiles} mi`;
      } else {
        // Return whole feet with commas
        return `${Math.round(distanceInFeet).toLocaleString('en-US')} ft`;
      }
    }

    // 2. Initialize Map
    const map = L.map('bsr-map', {
      maxBounds: bounds,
      maxBoundsViscosity: 1.0,
    }).fitBounds(bounds);

    // Explicitly add the fullscreen control
    if (L.Control.FullScreen) {
      map.addControl(
        new L.Control.FullScreen({
          position: 'topleft',
        }),
      );
    } else {
      console.error('The Fullscreen plugin failed to load.');
    }

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors',
    }).addTo(map);

    // 3. Fetch Locations from Overpass API
    async function fetchLocations() {
      const statusEl = document.getElementById('bsr-status-message');
      statusEl.innerText = 'Loading map data...';

      // Querying nodes and ways with names inside the bounds
      const overpassQuery = `
      [out:json][timeout:25];
      (
        node["name"](36.30766,-86.47862,36.32951,-86.44785);
        way["name"](36.30766,-86.47862,36.32951,-86.44785);
      );
      out center;
    `;
      const overpassUrl = 'https://overpass-api.de/api/interpreter';

      try {
        const response = await fetch(overpassUrl, {
          method: 'POST',
          body: overpassQuery,
        });
        const data = await response.json();

        const datalist = document.getElementById('bsr-destinations');

        data.elements.forEach((element) => {
          const name = element.tags.name;
          if (!name) return;

          // ways have 'center' for coords, nodes have 'lat' and 'lon' directly
          const lat = element.lat || element.center.lat;
          const lon = element.lon || element.center.lon;

          // Prevent duplicates in dropdown
          if (!locationsMap[name]) {
            locationsMap[name] = { lat, lon };
            const option = document.createElement('option');
            option.value = name;
            datalist.appendChild(option);
          }
        });
        statusEl.innerText = '';
        checkUrlParams();
      } catch (err) {
        console.error(err);
        statusEl.innerText = 'Failed to load locations. Please try refreshing.';
      }
    }

    // 4. Handle URL Params
    function checkUrlParams() {
      const queryString = window.location.search;
      console.log(`[URL Diagnostics] Raw query string: "${queryString}"`);

      const params = new URLSearchParams(queryString);
      const destParam = params.get('destination');
      console.log(
        `[URL Diagnostics] Parsed 'destination' parameter: "${destParam}"`,
      );

      if (destParam) {
        console.log(
          `[URL Diagnostics] Checking if "${destParam}" exists in locationsMap...`,
        );
        // Logs all known locations so you can check for exact spelling/casing matches
        console.log(
          `[URL Diagnostics] Current locationsMap keys:`,
          Object.keys(locationsMap),
        );

        if (locationsMap[destParam]) {
          console.log(
            `[URL Diagnostics] Match found! Auto-populating input and triggering search.`,
          );
          document.getElementById('bsr-destination-input').value = destParam;
          handleGoAction();
        } else {
          console.warn(
            `[URL Diagnostics] WARNING: "${destParam}" was not found in the locationsMap. It either hasn't loaded from OpenStreetMap yet, or there is a spelling/casing mismatch.`,
          );
        }
      } else {
        console.log(
          `[URL Diagnostics] No 'destination' parameter found in the URL. Proceeding normally.`,
        );
      }
    }

    // 5. Handle Navigation / Mapping Logic
    async function handleGoAction() {
      const inputVal = document.getElementById('bsr-destination-input').value;
      const statusEl = document.getElementById('bsr-status-message');

      if (!inputVal || !locationsMap[inputVal]) {
        statusEl.innerText = 'Please select a valid location from the list.';
        return;
      }

      statusEl.innerText = '';
      const destCoords = locationsMap[inputVal];

      // Clear previous markers/routes
      if (destinationMarker) map.removeLayer(destinationMarker);
      if (currentRouteLayer) map.removeLayer(currentRouteLayer);
      if (userMarker) map.removeLayer(userMarker);
      document.getElementById('bsr-directions').style.display = 'none';

      // Place marker for destination
      destinationMarker = L.marker([destCoords.lat, destCoords.lon], {
        icon: createColorMarker('var(--Scouting_Red)'),
      })
        .addTo(map)
        .bindPopup(`<b>${inputVal}</b>`)
        .openPopup();

      if (!isApp) {
        // Web Failsafe: Just pan to the location
        map.flyTo([destCoords.lat, destCoords.lon], 16);
        return;
      }

      // App Navigation Logic (Capacitor)
      let userLat, userLon;

      // Stage 1: Get User Location
      try {
        statusEl.innerText = 'Finding your location...';
        const position = await Geolocate.getCurrentPosition({
          enableHighAccuracy: true,
        });
        userLat = position.coords.latitude;
        userLon = position.coords.longitude;

        // Draw the user marker immediately
        userMarker = L.marker([userLat, userLon], {
          icon: createColorMarker('var(--Scouting_Light_Blue)'),
        })
          .addTo(map)
          .bindPopup('You are here');

        // Adjust map to temporarily fit both markers while routing
        map.fitBounds(
          L.latLngBounds([userLat, userLon], [destCoords.lat, destCoords.lon]),
          { padding: [50, 50] },
        );
      } catch (error) {
        console.error('Location Error:', error);
        statusEl.innerText =
          'Cannot get location. Showing destination instead.';
        map.flyTo([destCoords.lat, destCoords.lon], 16);
        return;
      }

      // Stage 2: Calculate Route (with Fallback)
      try {
        statusEl.innerText = 'Calculating route...';
        await calculateRoute(userLat, userLon, destCoords.lat, destCoords.lon);
        statusEl.innerText = ''; // Clear status on success
      } catch (error) {
        console.warn('Routing Error, falling back to direct line:', error);
        statusEl.innerText = 'No pathway found. Showing direct line instead.';

        // --- FALLBACK LOGIC ---

        // 1. Draw straight dashed line to indicate an estimated, direct path
        currentRouteLayer = L.polyline(
          [
            [userLat, userLon],
            [destCoords.lat, destCoords.lon],
          ],
          { color: 'gray', weight: 4, dashArray: '10, 10' },
        ).addTo(map);

        // 2. Ensure map fits the new straight line
        map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });

        // 3. Calculate distance using Leaflet's built-in distance method (returns meters)
        const startLatLng = L.latLng(userLat, userLon);
        const endLatLng = L.latLng(destCoords.lat, destCoords.lon);
        const distanceMeters = startLatLng.distanceTo(endLatLng);

        // Format string (uses miles if > 5280 ft)
        const displayDistance = formatDistance(distanceMeters);

        // 4. Update Directions Panel with fallback instruction
        const directionsList = document.getElementById('bsr-directions-list');
        directionsList.innerHTML = `
          <li>
            <b>Straight-Line Distance:</b> ${displayDistance} <br>
            <i style="color: #666; font-size: 13px;">Note: A mapped pathway could not be found. Head generally towards the destination marker, but be aware of real-world obstacles and terrain.</i>
          </li>`;

        document.getElementById('bsr-directions').style.display = 'block';
      }
    }

    // 6. OpenRouteService Routing
    async function calculateRoute(startLat, startLon, endLat, endLon) {
      // ORS requires coordinates in longitude, latitude order
      const url = `https://api.heigit.org/openrouteservice/v2/directions/foot-walking?api_key=${orsApiKey}&start=${startLon},${startLat}&end=${endLon},${endLat}`;

      const response = await fetch(url);
      const data = await response.json();

      if (data.features && data.features.length > 0) {
        const feature = data.features[0];

        // 1. Draw the Polyline
        // ORS returns GeoJSON which is [lon, lat], Leaflet wants [lat, lon]
        const coords = feature.geometry.coordinates.map((c) => [c[1], c[0]]);
        currentRouteLayer = L.polyline(coords, {
          color: 'blue',
          weight: 5,
        }).addTo(map);

        // 2. Zoom map to fit the route
        map.fitBounds(currentRouteLayer.getBounds(), { padding: [50, 50] });

        // 3. GENERATE DIRECTIONS
        const steps = feature.properties.segments[0].steps;

        if (steps && steps.length > 0) {
          const directionsList = document.getElementById('bsr-directions-list');
          directionsList.innerHTML = ''; // Clear old instructions

          steps.forEach((step) => {
            const li = document.createElement('li');

            // Format distance string (uses miles if > 5280 ft)
            const distanceText =
              step.distance > 0 ? ` (${formatDistance(step.distance)})` : '';

            // Set the text (ORS uses 'instruction' instead of 'text')
            li.innerText = step.instruction + distanceText;
            directionsList.appendChild(li);
          });

          // Reveal the directions panel
          document.getElementById('bsr-directions').style.display = 'block';
        }
      } else if (data.error) {
        // This extracts the exact reason ORS rejected the request
        throw new Error(
          `ORS API: ${data.error.message || JSON.stringify(data.error)}`,
        );
      } else {
        throw new Error(`Unexpected Response: ${JSON.stringify(data)}`);
      }
    }

    // Event Listeners
    document
      .getElementById('bsr-go-btn')
      .addEventListener('click', handleGoAction);

    // Trigger on Enter key
    document
      .getElementById('bsr-destination-input')
      .addEventListener('keypress', function (e) {
        if (e.key === 'Enter') handleGoAction();
      });

    // Initialize data fetch
    fetchLocations();
  });
</script>

<div class="bsr-map-container">
  <!-- Static Control Panel -->
  <div class="bsr-controls">
    <div class="bsr-search-wrapper">
      <input
        type="text"
        id="bsr-destination-input"
        list="bsr-destinations"
        placeholder="Search for a place..."
        autocomplete="off"
      />
      <datalist id="bsr-destinations">
        <!-- Options injected via Overpass API -->
      </datalist>
      <button id="bsr-go-btn" type="button">Go</button>
    </div>
    <div id="bsr-status-message"></div>
  </div>

  <!-- Map Display -->
  <div id="bsr-map"></div>

  <!-- Directions Panel (Hidden by default) -->
  <div id="bsr-directions" style="display: none">
    <h3>Directions</h3>
    <ol id="bsr-directions-list"></ol>
  </div>
</div>
